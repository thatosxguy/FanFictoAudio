name: Bug report
description: Report a reproducible app problem with sanitized details.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Keep API keys, INI files, cookies, private URLs, books, and audio out of this public report. Report vulnerabilities privately through the Security tab."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App version, macOS version, Apple silicon or Intel, and speech provider.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a synthetic example when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error details
      description: Remove credentials, private story content, and personal paths before posting.
